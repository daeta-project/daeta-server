services:
  redis:
    image: redis:7.4-alpine
    container_name: redis-daeta
    restart: always
    ports:
      - ${REDIS_CONTAINER_PORT}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["/bin/sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
volumes:
  redis_data: